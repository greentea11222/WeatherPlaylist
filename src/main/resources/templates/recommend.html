<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>お天気プレイリスト</title>
	<style>
		/* 全体の背景と文字設定 */
		body { font-family: Arial, sans-serif; background: #f0f4f8; text-align: center; padding: 50px; }
		.playlist-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
		.music-item { margin: 15px 0; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
		.play-btn { background: #ff0000; color: white; padding: 5px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; }
		.play-btn:hover { background: #cc0000;}
		
		/* 天気情報エリアのスタイル */
		.weather-header {
			background: linear-gradient(135deg, #4299e1, #3182ce);
			color: white;
			padding: 20px 30px;
			border-radius: 15px;
			max-width: 400px;
			margin: 0 auto 30 px auto;
			box-shadow: 0 4px 15px rgba(0,0,0,0.1);
		}
		.weather-header h1 { margin: 0 0 10px 0; font-size: 24px; }
		.weather-info { font-size: 18px; margin: 5px 0; }
		.temp { font-size: 32px; font-weight: bold; margin: 10px 0 0 0; }
		
		/* プレイリストエリアのスタイル */
		.playlist-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px ggba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
		.music-item { margin: 15px 0; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
		.play-btn { background: #ff0000; color: white; padding: 5px 15px; text-decoration: none; font-weight: bold; font-size: 14px; }
		.play-btn:hover { background: #cc0000; }
	</style>
</head>
<body>
	<!-- 気温・都市名を表示するヘッダーエリア -->
	<div class="weather-header">
		<h1 th:text="${cityName} + ' の現在の天気'">Tokyo の現在の天気</h1>
		<div class="weather-info">
			状態：<span th:text="${currentStatus}" style="font-weight: bold;">SUNNY</span>
		</div>
		<div class="temp">
			<span th:text="${temperature}">25.0</span>
		</div>
	</div>
	<!-- プレイリストエリア -->
	<div class="playlist-card" th:each="playlist: ${playlists}">
		<h2 th:text="${playlist.title}"プレイリスト名></h2>
		<p>現在の気分：<span th:text="${playlist.status}" style="font-weight: bold; color: #3182ce">STATUS</span></p>
		<hr>
		
		<div>
			<div class="music-item" th:each="music : ${playlist.musicList}">
				<div style="text-align: left;">
					<string th:text="${music.title}">曲名</string><br>
					<small th:text="${music.artist}" style="color: #666">アーティスト</small>
				</div>
				<a th:href="${music.youtubeUrl}" target="_blank" class="play-btn">再生</a>
			</div>
		</div>
	</div>
</body>
</html>
