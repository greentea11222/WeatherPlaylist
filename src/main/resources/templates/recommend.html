<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お天気プレイリスト</title>
    <style>
        /* 全体の背景と文字設定 */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: #eef2f7; 
            margin: 0;
            padding: 40px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
			transition: background 0.5s ease;
			min-height: 100vh;
        }
		/* 晴れの日の背景テーマ */
		body.theme-SUNNY {
			background: linear-gradient(135deg, #e0f2fe, #bae6fa);
		}
		/* 雨の日の背景テーマ */
		body.theme-RAINY {
			background: linear-gradient(135deg, #cfdaf0, #94a3b8);
		}
		
		/* 曇りの日の背景テーマ */
		body.theme-FOGGY {
			background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
		}
		
		/* 雪の日の背景テーマ */
		body.theme-SNOWY {
			background: linear-gradient(135deg, #f1f5f9, #e0f2fe);
		}
		
        /* ☀️ お天気情報ヘッダーエリア */
        .weather-header {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 24px 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25);
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 24px;
        }
        .weather-header h1 { 
            margin: 0 0 8px 0; 
            font-size: 22px; 
            font-weight: 600;
        }
        .weather-info { 
            font-size: 16px; 
            opacity: 0.9;
        }
        .temp { 
            font-size: 38px; 
            font-weight: bold; 
            margin-top: 8px; 
        }

        /* 🎵 プレイリストカードエリア */
        .playlist-card { 
            background: white; 
            padding: 28px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06); 
            width: 100%;
            max-width: 420px; 
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .playlist-card h2 {
            margin: 0 0 16px 0;
            font-size: 20px;
            color: #1e293b;
            text-align: center;
        }
        .divider {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin-bottom: 16px;
        }

        /* 🎼 曲ごとの表示枠 */
        .music-item { 
            padding: 12px 0; 
            border-bottom: 1px solid #f1f5f9; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .music-item:last-child {
            border-bottom: none;
        }
        .music-info {
            text-align: left;
            max-width: 240px;
        }
        .music-title {
            font-weight: bold;
            font-size: 15px;
            color: #334155;
            display: block;
            margin-bottom: 4px;
        }
        .music-artist {
            color: #64748b;
            font-size: 13px;
        }

        /* 🔴 再生ボタン */
        .play-btn { 
            background: #ef4444; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 20px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 13px; 
            transition: background 0.2s ease, transform 0.1s ease;
            white-space: nowrap;
        }
        .play-btn:hover { 
            background: #dc2626; 
            transform: scale(1.03);
        }
		/* 🏙️ 都市選択フォームエリア */
		        .city-form-container {
		            background: white;
		            padding: 16px 24px;
		            border-radius: 16px;
		            width: 100%;
		            max-width: 420px;
		            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
		            box-sizing: border-box;
		            margin-bottom: 20px;
		            display: flex;
		            align-items: center;
		            justify-content: space-between;
		        }
		        .city-form-container label {
		            font-size: 14px;
		            font-weight: bold;
		            color: #475569;
		        }
		        .city-select {
		            padding: 8px 12px;
		            border-radius: 8px;
		            border: 1px solid #cbd5e1;
		            font-size: 14px;
		            outline: none;
		            background: #f8fafc;
		        }
		        .city-btn {
		            background: #3b82f6;
		            color: white;
		            border: none;
		            padding: 8px 16px;
		            border-radius: 8px;
		            font-weight: bold;
		            font-size: 14px;
		            cursor: pointer;
		            transition: background 0.2s ease;
		        }
		        .city-btn:hover {
		            background: #2563eb;
		        }
				/* 埋め込みプレイヤーの枠組み*/
				.video-container {
					position: relative;
					width: 100%;
					padding-top: 56.25%;
					margin-top:12px;
					overflow: hidden;
					background: #000;
				}
				.video-container iframe {
					position: absolute;
					top: 0;
					left: 0;
					width: 100%;
					height: 100%;
					border: none;
				}
    </style>
</head>
<body>
	<!-- 天気ごとにクラスを変更-->
	<body th:classapend="'theme-' + ${currentStatus}">
    <!-- 🏙️ 都市を選択するドロップダウンフォーム -->
    <div class="city-form-container">
        <label for="citySelect">📍 都市を選択:</label>
        <form action="/api/recommend-view" method="get" style="display: flex; gap: 8px;">
            <select id="citySelect" name="city" class="city-select">
                <option value="Tokyo" th:selected="${cityName == 'Tokyo'}">東京 (Tokyo)</option>
                <option value="Osaka" th:selected="${cityName == 'Osaka'}">大阪 (Osaka)</option>
                <option value="Sapporo" th:selected="${cityName == 'Sapporo'}">札幌 (Sapporo)</option>
                <option value="Okinawa" th:selected="${cityName == 'Okinawa'}">沖縄 (Okinawa)</option>
            </select>
            <button type="submit" class="city-btn">変更</button>
        </form>
    </div>
    <!-- ☀️ 気温・都市名を表示するヘッダーエリア -->
    <div class="weather-header">
        <h1 th:text="${cityName} + ' の現在の天気'">Tokyo の現在の天気</h1>
        <div class="weather-info">
            状態: <span th:text="${currentStatus}" style="font-weight: bold;">SUNNY</span>
        </div>
        <div class="temp">
            <span th:text="${temperature}">25.0</span>℃
        </div>
    </div>

    <!-- 🎵 おすすめプレイリストエリア -->
    <div class="playlist-card" th:each="playlist : ${playlists}">
        <h2 th:text="${playlist.title}">プレイリスト名</h2>
        <div class="divider"></div>
        
        <div class="music-item" th:each="music : ${playlist.musicList}">
            <div class="music-info">
                <span class="music-title" th:text="${music.title}">曲名</span>
                <span class="music-artist" th:text="${music.artist}">アーティスト</span>
            </div>
			<div class="video-container">
				<iframe
					th:src="${music.youtubeUrl}"
					title="YouTube video player"
					allow="accelerometer; autoplay; clipboard-white; encrypted-media; gyroscope; picture-in-picture"
					allowfullscreen>
			</iframe>
			</div>
        </div>
    </div>

</body>
</html>
